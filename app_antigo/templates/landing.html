<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Agendamento</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        [data-bs-theme="dark"] { --bs-primary: #00a859; --bs-primary-rgb: 0, 168, 89; }
        .btn-primary { --bs-btn-bg: #00a859; --bs-btn-border-color: #00a859; }
        .btn-primary:hover { --bs-btn-hover-bg: #008f4a; --bs-btn-hover-border-color: #008f4a; }
        .btn-outline-success { --bs-btn-color: #00a859; --bs-btn-border-color: #00a859; }
        .btn-outline-success:hover { --bs-btn-hover-bg: #00a859; --bs-btn-hover-border-color: #00a859; }
        .logo { font-size: 3rem; font-weight: 700; color: #00a859; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <div class="container text-center flex-grow-1 d-flex flex-column justify-content-center" style="max-width: 600px;">
        <div class="logo mb-2">&#9776;</div>
        <h1 class="display-5 fw-bold mb-2">Sistema de Agendamento</h1>
        <p class="lead mb-4">
            Bem-vindo ao sistema de agendamento de atendimentos.
            Esta ferramenta permite que a central de atendimento agende horarios
            com o colaborador, e que cada colaborador gerencie sua propria agenda.
        </p>
        <a href="/inicio_atendimento" class="text-decoration-none text-light">
            <button type="button" class="btn btn-primary w-100 py-2 my-1 fs-3">Atendimento</button>
        </a>
        <a href="/inicio_colaborador" class="text-decoration-none text-light">
            <button type="button" class="btn btn-primary w-100 py-2 my-1 fs-3">Colaborador</button>
        </a>
        <!-- <p class="text-muted mb-4">
            <em>Chame o gerenciador do aplicativo para fazer a configuracao adequada para seu setor.</em>
        </p> -->
    </div>
    <footer class="text-center text-muted small py-2 mt-auto border-top bg-body-secondary">{{ versao }}</footer>
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
