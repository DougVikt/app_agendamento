<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedagogico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        [data-bs-theme="dark"] { --bs-primary: #00a859; --bs-primary-rgb: 0, 168, 89; }
        .btn-success { --bs-btn-bg: #00a859; --bs-btn-border-color: #00a859; }
        .btn-success:hover { --bs-btn-hover-bg: #008f4a; --bs-btn-hover-border-color: #008f4a; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 bg-body-tertiary">
    <div class="container" style="max-width: 400px;">
        <div class="card shadow">
            <div class="card-body p-4 text-center">
                <h3 class="mb-3">Pedagógico</h3>
                <p class="text-muted mb-4">Selecione seu nome para acessar</p>
                <form action="/login/pedagogico" method="post">
                    <div class="mb-3">
                        <select name="nome" class="form-select" id="selectPed" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-3">Entrar</button>
                </form>
                <p class="mt-2 small"><a href="/login/pedagogico?cadastrar=1" id="linkCadastrar">Sou novo — cadastrar</a></p>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalCadastro" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5>Novo Pedagogico</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="novoProfNome" class="form-control" placeholder="Nome do pedagogico">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="cadastrar()">Cadastrar e Entrar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="text-center text-muted small py-3">{{ versao }}</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function carregar() {
            fetch('/api/pedagogicos').then(r => r.json()).then(data => {
                const sel = document.getElementById('selectPed');
                sel.innerHTML = '<option value="">Selecione...</option>';
                data.forEach(p => { sel.innerHTML += `<option value="${p.nome}">${p.nome}</option>`; });
            });
        }

        function cadastrar() {
            const nome = document.getElementById('novoProfNome').value.trim();
            if (!nome) return alert('Digite um nome');
            fetch('/api/pedagogicos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nome})
            }).then(r => r.json()).then(d => {
                if (d.erro) return alert(d.erro);
                const form = document.querySelector('form');
                const input = document.createElement('input');
                input.type = 'hidden'; input.name = 'nome'; input.value = d.nome;
                form.appendChild(input);
                form.submit();
            });
        }

        carregar();
        if (window.location.search.includes('cadastrar=1')) {
            new bootstrap.Modal(document.getElementById('modalCadastro')).show();
        }
    </script>
</body>
</html>
