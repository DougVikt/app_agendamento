<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Central de Atendimento</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        [data-bs-theme="dark"] { --bs-primary: #00a859; --bs-primary-rgb: 0, 168, 89; --bs-link-color: #00a859; }
        .btn-primary { --bs-btn-bg: #00a859; --bs-btn-border-color: #00a859; }
        .btn-primary:hover { --bs-btn-hover-bg: #008f4a; --bs-btn-hover-border-color: #008f4a; }
        .btn-outline-success { --bs-btn-color: #00a859; --bs-btn-border-color: #00a859; }
        .btn-outline-success:hover { --bs-btn-hover-bg: #00a859; --bs-btn-hover-border-color: #00a859; }
        .navbar { background-color: #008f4a !important; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Central de Atendimento</span>
            <div>
                <a href="/historico" class="btn btn-outline-light btn-sm me-2">Historico</a>
                <a href="/inicio_atendimento" class="btn btn-outline-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container flex-grow-1">
        <div id="alertBox" class="alert alert-warning d-none shadow" role="alert">
            <strong>Atencao!</strong> <span id="alertMsg"></span>
        </div>

        <!-- Filtros -->
        <div class="card shadow mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label">colaborador</label>
                        <select id="filtroPed" class="form-select" onchange="onPedChange()">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Data</label>
                        <select id="filtroData" class="form-select" onchange="onDataChange()" disabled>
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-grid">
                        <button class="btn btn-outline-secondary" onclick="limparFiltros()">Limpar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Slots -->
            <div class="col-md-7">
                <div class="card shadow mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Horarios Disponiveis</h5>
                        <span id="qtdSlots" class="badge bg-success">0</span>
                    </div>
                    <div class="card-body p-0" id="slotsContainer">
                        <div class="text-center text-muted py-5">Selecione colaborador e data</div>
                    </div>
                </div>
            </div>

            <!-- Agendamentos -->
            <div class="col-md-5">
                <div class="card shadow mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Agendamentos</h5>
                        <span id="qtdAgendados" class="badge bg-info">0</span>
                    </div>
                    <div class="card-body p-0" style="max-height: 600px; overflow-y: auto;">
                        <table class="table table-sm table-striped mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>cliente</th><th>Tel.</th><th>Tipo</th><th>Ped.</th><th>Data</th><th>Hora</th><th></th>
                                </tr>
                            </thead>
                            <tbody id="tabelaAgendados"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalConfirmar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5>Confirmar Agendamento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="confirmInfo" class="mb-3"></p>
                    <div class="mb-3">
                        <label class="form-label">Tipo de Atendimento</label>
                        <input type="text" id="campoTipo" class="form-control" placeholder="Ex: Apoio, Reforco, Exame">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome do Cliente</label>
                        <input type="text" id="clienteNome" class="form-control" placeholder="Digite o nome">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CPF</label>
                        <input type="text" id="clienteCPF" class="form-control" placeholder="Digite a CPF">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telefone</label>
                        <input type="text" id="clienteTelefone" class="form-control" placeholder="(11) 99999-8888">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observacoes <small class="text-muted">(opcional)</small></label>
                        <textarea id="clienteObs" class="form-control" rows="2" placeholder="Observacoes sobre o atendimento"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="confirmarAgendamento()">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalObs" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5>Observações</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalObsTexto"></div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted small py-2 mt-auto border-top bg-body-secondary">{{ versao }}</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fmtD(iso) { if (!iso) return ''; const [a,m,d] = iso.split('-'); return `${d}/${m}/${a}`; }

        function verObs(el) { document.getElementById('modalObsTexto').textContent = decodeURIComponent(el.dataset.obs); new bootstrap.Modal(document.getElementById('modalObs')).show(); }

        const modal = new bootstrap.Modal(document.getElementById('modalConfirmar'));
        let slotSelecionado = null;
        let colaboradorCache = {};

        function carregarcolaborador() {
            fetch('/api/colaborador').then(r => r.json()).then(data => {
                const sel = document.getElementById('filtroPed');
                sel.innerHTML = '<option value="">Selecione...</option>';
                data.forEach(p => { colaboradorCache[p.id] = p.nome;
                    sel.innerHTML += `<option value="${p.id}">${p.nome}</option>`; });
            });
        }

        function onPedChange() {
            const pid = document.getElementById('filtroPed').value;
            const sd = document.getElementById('filtroData');
            sd.innerHTML = '<option value="">Selecione...</option>'; sd.disabled = true;
            document.getElementById('slotsContainer').innerHTML = '<div class="text-center text-muted py-5">Selecione colaborador e data</div>';
            document.getElementById('qtdSlots').textContent = '0';
            if (!pid) return;
            fetch('/api/datas/' + pid).then(r => r.json()).then(d => {
                sd.disabled = false;
                d.forEach(x => { sd.innerHTML += `<option value="${x}">${fmtD(x)}</option>`; });
            });
        }

        function onDataChange() {
            const pid = document.getElementById('filtroPed').value;
            const data = document.getElementById('filtroData').value;
            if (!pid || !data) return;
            fetch(`/api/slots?colaborador_id=${pid}&data=${data}`)
                .then(r => r.json()).then(slots => {
                const c = document.getElementById('slotsContainer');
                const q = document.getElementById('qtdSlots');
                if (!slots.length) { c.innerHTML = '<div class="text-center text-muted py-5">Nenhum horario disponivel</div>'; q.textContent = '0'; return; }
                q.textContent = slots.length;
                let h = '<div class="row g-2 p-3">';
                slots.forEach(s => { h += `<div class="col-4 col-md-3"><button class="btn btn-outline-success w-100" onclick="agendar('${s}')">${s}</button></div>`; });
                c.innerHTML = h + '</div>';
            });
        }

        function agendar(hora) {
            const pid = document.getElementById('filtroPed').value;
            const data = document.getElementById('filtroData').value;
            document.getElementById('confirmInfo').innerHTML =
                `<strong>colaborador:</strong> ${colaboradorCache[pid]}<br><strong>Data:</strong> ${fmtD(data)}<br><strong>Horario:</strong> ${hora}`;
            document.getElementById('campoTipo').value = '';
            document.getElementById('clienteNome').value = '';
            document.getElementById('clienteCPF').value = '';
            document.getElementById('clienteTelefone').value = '';
            document.getElementById('clienteObs').value = '';
            slotSelecionado = { colaborador_id: parseInt(pid), data, hora_inicio: hora };
            modal.show();
        }

        function confirmarAgendamento() {
            const tipo = document.getElementById('campoTipo').value.trim();
            const cliente = document.getElementById('clienteNome').value.trim();
            const CPF = document.getElementById('clienteCPF').value.trim();
            const telefone = document.getElementById('clienteTelefone').value.trim();
            const observacoes = document.getElementById('clienteObs').value.trim();
            if (!tipo) return alert('Digite o tipo de atendimento');
            if (!cliente) return alert('Digite o nome do cliente');
            fetch('/api/agendamentos', { method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({...slotSelecionado, tipo, cliente, CPF, telefone, observacoes}) })
                .then(r => r.json()).then(d => {
                if (d.erro) return alert(d.erro);
                modal.hide(); onDataChange(); carregarAgendamentos(); carregarAlertas();
            });
        }

        function carregarAlertas() {
            fetch('/api/agendamentos?status=pendentes').then(r => r.json()).then(data => {
                const box = document.getElementById('alertBox'), msg = document.getElementById('alertMsg');
                if (!data.length) { box.classList.add('d-none'); return; }
                box.classList.remove('d-none');
                msg.innerHTML = `${data.length} pendente(s)! ` +
                    data.map(a => `<br><small>${a.cliente} - ${a.colaborador_nome} - ${fmtD(a.data)} ${a.hora_inicio}</small>`).join('');
            });
        }

        function carregarAgendamentos() {
            fetch('/api/agendamentos').then(r => r.json()).then(data => {
                const tbody = document.getElementById('tabelaAgendados');
                document.getElementById('qtdAgendados').textContent = data.length;
                tbody.innerHTML = '';
                data.slice(0, 100).forEach(a => {
                    const podeCancelar = a.status === 'Agendado';
                    tbody.innerHTML += `<tr>
                        <td class="small">${a.cliente}${a.observacoes ? ` <span class="text-muted" style="cursor:pointer" onclick="verObs(this)" data-obs="${encodeURIComponent(a.observacoes)}">&#9998;</span>` : ''}</td>
                        <td class="small">${a.telefone || ''}</td>
                        <td class="small">${a.tipo}</td>
                        <td class="small">${a.colaborador_nome}</td>
                        <td class="small">${fmtD(a.data)}</td>
                        <td class="small">${a.hora_inicio}</td>
                        <td class="small text-nowrap">${podeCancelar ? `<button class="btn btn-outline-danger btn-sm py-0 px-1" onclick="cancelarAgendamento(${a.id})">Cancelar</button>` : `<span class="badge ${a.status==='Atendido'?'bg-success':a.status==='Cancelado'?'bg-secondary':'bg-warning text-dark'}">${a.status}</span>`}</td>
                    </tr>`;
                });
            });
        }

        function cancelarAgendamento(id) {
            if (!confirm('Cancelar este agendamento?')) return;
            fetch('/api/agendamentos/' + id + '/status', {
                method: 'PATCH', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status: 'Cancelado'})
            }).then(r => r.json()).then(() => {
                if (document.getElementById('filtroData').value) onDataChange();
                carregarAgendamentos(); carregarAlertas();
            });
        }

        function limparFiltros() {
            document.getElementById('filtroPed').value = '';
            document.getElementById('filtroData').innerHTML = '<option value="">Selecione...</option>';
            document.getElementById('filtroData').disabled = true;
            document.getElementById('slotsContainer').innerHTML = '<div class="text-center text-muted py-5">Selecione colaborador e data</div>';
            document.getElementById('qtdSlots').textContent = '0';
        }

        carregarcolaborador(); carregarAgendamentos(); carregarAlertas();
        setInterval(() => {
            if (document.getElementById('filtroData').value) onDataChange();
            carregarAgendamentos(); carregarAlertas();
        }, 15000);
    </script>
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
