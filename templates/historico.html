<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historico de Atendimentos</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        [data-bs-theme="dark"] { --bs-primary: #00a859; --bs-primary-rgb: 0, 168, 89; --bs-link-color: #00a859; }
        .btn-primary { --bs-btn-bg: #00a859; --bs-btn-border-color: #00a859; }
        .btn-primary:hover { --bs-btn-hover-bg: #008f4a; --bs-btn-hover-border-color: #008f4a; }
        .navbar { background-color: #008f4a !important; }
    </style>
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Historico de Atendimentos</span>
            <div>
                {% if role == 'central' %}
                    <a href="/central" class="btn btn-outline-light btn-sm">Voltar</a>
                {% elif role == 'pedagogico' %}
                    <a href="/pedagogico" class="btn btn-outline-light btn-sm">Voltar</a>
                {% else %}
                    <a href="/" class="btn btn-outline-light btn-sm">Voltar</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Atendimentos Concluidos</h5>
                <span id="qtdHist" class="badge bg-success">0</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive" style="max-height: 70vh; overflow-y: auto;">
                    <table class="table table-striped mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Aluno</th><th>Matricula</th><th>Pedagogico</th><th>Tipo</th><th>Data</th><th>Hora</th><th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaHistorico"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center text-muted small py-3">{{ versao }}</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fmtD(iso) { if (!iso) return ''; const [a,m,d] = iso.split('-'); return `${d}/${m}/${a}`; }

        function carregar() {
            fetch('/api/agendamentos?status=Atendido').then(r => r.json()).then(data => {
                const tbody = document.getElementById('tabelaHistorico');
                document.getElementById('qtdHist').textContent = data.length;
                tbody.innerHTML = '';
                if (!data.length) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Nenhum atendimento concluido</td></tr>';
                    return;
                }
                data.forEach(a => {
                    tbody.innerHTML += `<tr>
                        <td>${a.aluno}</td>
                        <td>${a.matricula}</td>
                        <td>${a.pedagogico_nome}</td>
                        <td>${a.tipo}</td>
                        <td>${fmtD(a.data)}</td>
                        <td>${a.hora_inicio}</td>
                        <td><span class="badge bg-success">Atendido</span></td>
                    </tr>`;
                });
            });
        }
        carregar();
    </script>
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
