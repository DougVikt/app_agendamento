<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Administracao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        [data-bs-theme="dark"] { --bs-primary: #00a859; --bs-primary-rgb: 0, 168, 89; }
        .btn-primary { --bs-btn-bg: #00a859; --bs-btn-border-color: #00a859; }
        .btn-primary:hover { --bs-btn-hover-bg: #008f4a; --bs-btn-hover-border-color: #008f4a; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <div class="container flex-grow-1 d-flex align-items-center" style="max-width: 400px;">
        <div class="card shadow w-100">
            <div class="card-body p-4">
                <h4 class="text-center mb-4">Acesso Administrativo</h4>
                {% if erro %}
                <div class="alert alert-danger py-2">{{ erro }}</div>
                {% endif %}
                <form method="POST" action="/admin/login">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="usuario" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
    <footer class="text-center text-muted small py-2 mt-auto border-top bg-body-secondary">{{ versao }}</footer>
</body>
</html>
