<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Central de Atendimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        [data-bs-theme="dark"] { --bs-primary: #00a859; --bs-primary-rgb: 0, 168, 89; }
        .btn-primary { --bs-btn-bg: #00a859; --bs-btn-border-color: #00a859; }
        .btn-primary:hover { --bs-btn-hover-bg: #008f4a; --bs-btn-hover-border-color: #008f4a; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 bg-body-tertiary">
    <div class="container" style="max-width: 400px;">
        <div class="card shadow">
            <div class="card-body p-4 text-center">
                <h3 class="mb-3">Central de Atendimento</h3>
                <p class="text-muted mb-4">Clique para acessar o sistema</p>
                <form action="/login/central" method="post">
                    <button type="submit" class="btn btn-primary w-100 py-3">Entrar</button>
                </form>
            </div>
        </div>
    </div>
    <div class="text-center text-muted small py-3">{{ versao }}</div>
</body>
</html>
