<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        [data-bs-theme="dark"] { --bs-primary: #00a859; --bs-primary-rgb: 0, 168, 89; --bs-link-color: #00a859; }
        .btn-primary { --bs-btn-bg: #00a859; --bs-btn-border-color: #00a859; }
        .btn-primary:hover { --bs-btn-hover-bg: #008f4a; --bs-btn-hover-border-color: #008f4a; }
        .btn-outline-primary { --bs-btn-color: #00a859; --bs-btn-border-color: #00a859; }
        .btn-outline-primary:hover { --bs-btn-hover-bg: #00a859; --bs-btn-hover-border-color: #00a859; }
        .btn-outline-success { --bs-btn-color: #00a859; --bs-btn-border-color: #00a859; }
        .btn-outline-success:hover { --bs-btn-hover-bg: #00a859; --bs-btn-hover-border-color: #00a859; }
        .btn-outline-danger { --bs-btn-color: #dc3545; --bs-btn-border-color: #dc3545; }
        .btn-outline-danger:hover { --bs-btn-hover-bg: #dc3545; --bs-btn-hover-border-color: #dc3545; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 bg-body-tertiary">
    <div class="container" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-body p-4 text-center">
                <h3 class="mb-3">Sistema de Agendamento</h3>
                <p class="text-muted mb-4">Escolha seu perfil</p>

                <a href="/login/central" class="btn btn-outline-primary w-100 mb-3 py-3">
                    Central de Atendimento
                    <small class="d-block text-muted">Fazer agendamentos</small>
                </a>

                <a href="/login/pedagogico" class="btn btn-outline-success w-100 py-3 mb-3">
                    Pedagógico
                    <small class="d-block text-muted">Gerenciar meus horarios</small>
                </a>

                <p class="text-muted small mt-3">
                    <a href="#" data-bs-toggle="modal" data-bs-target="#modalGerenciar">Gerenciar pedagogicos</a>
                    &nbsp;|&nbsp;
                    <a href="/historico">Historico de atendimentos</a>
                </p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalGerenciar" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Gerenciar Pedagogicos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="text-end mb-3">
                        <button class="btn btn-primary btn-sm" onclick="abrirCadastro()">+ Novo</button>
                    </div>
                    <table class="table table-striped mb-0">
                        <thead class="table-dark">
                            <tr><th>Nome</th><th class="text-end" style="width:140px"></th></tr>
                        </thead>
                        <tbody id="tabelaPedagogicos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 id="editarTitulo">Editar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="editarNome" class="form-control" placeholder="Nome do pedagogico">
                    <input type="hidden" id="editarId" value="">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="salvarEdicao()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNovoProf" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5>Novo Pedagogico</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="novoProfNome" class="form-control" placeholder="Nome do pedagogico">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="cadastrarProf()">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center text-muted small py-3">{{ versao }}</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function carregarLista() {
            fetch('/api/pedagogicos').then(r => r.json()).then(data => {
                const tbody = document.getElementById('tabelaPedagogicos');
                tbody.innerHTML = '';
                if (!data.length) { tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted py-3">Nenhum pedagogico cadastrado</td></tr>'; return; }
                data.forEach(p => {
                    tbody.innerHTML += `<tr>
                        <td class="align-middle">${p.nome}</td>
                        <td class="text-end">
                            <button class="btn btn-outline-primary btn-sm py-0 px-2" onclick="editar(${p.id},'${p.nome.replace(/'/g,"\\'")}')">Editar</button>
                            <button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="excluir(${p.id},'${p.nome.replace(/'/g,"\\'")}')">Excluir</button>
                        </td>
                    </tr>`;
                });
            });
        }

        function abrirCadastro() {
            bootstrap.Modal.getInstance(document.getElementById('modalGerenciar')).hide();
            new bootstrap.Modal(document.getElementById('modalNovoProf')).show();
        }

        function cadastrarProf() {
            const nome = document.getElementById('novoProfNome').value.trim();
            if (!nome) return alert('Digite um nome');
            fetch('/api/pedagogicos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nome})
            }).then(r => r.json()).then(d => {
                if (d.erro) return alert(d.erro);
                document.getElementById('novoProfNome').value = '';
                bootstrap.Modal.getInstance(document.getElementById('modalNovoProf')).hide();
                new bootstrap.Modal(document.getElementById('modalGerenciar')).show();
                carregarLista();
            });
        }

        function editar(id, nome) {
            document.getElementById('editarId').value = id;
            document.getElementById('editarNome').value = nome;
            document.getElementById('editarTitulo').textContent = 'Editar - ' + nome;
            new bootstrap.Modal(document.getElementById('modalEditar')).show();
        }

        function salvarEdicao() {
            const id = document.getElementById('editarId').value;
            const nome = document.getElementById('editarNome').value.trim();
            if (!nome) return alert('Digite um nome');
            fetch('/api/pedagogicos/' + id, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nome})
            }).then(r => r.json()).then(d => {
                if (d.erro) return alert(d.erro);
                bootstrap.Modal.getInstance(document.getElementById('modalEditar')).hide();
                carregarLista();
            });
        }

        function excluir(id, nome) {
            if (!confirm('Excluir "' + nome + '" e todos os seus horarios/agendamentos?')) return;
            fetch('/api/pedagogicos/' + id, {method: 'DELETE'})
                .then(r => r.json()).then(() => carregarLista());
        }

        document.getElementById('modalGerenciar').addEventListener('show.bs.modal', carregarLista);
        document.getElementById('modalEditar').addEventListener('shown.bs.modal', () => document.getElementById('editarNome').focus());
    </script>
</body>
</html>
