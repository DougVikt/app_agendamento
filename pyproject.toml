[project]
name = "app-agendamento"
version = "2.5"
description = "App para agendamento web entre atendentes e colaboradores"
authors = [
    {name = "dougvikt"}
]
license = {text = "mit"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "make (>=0.1.6.post2,<0.2.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
