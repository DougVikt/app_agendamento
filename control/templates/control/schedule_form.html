<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova grade — Profissional</title>
</head>
<body>
  <h1>Nova grade de horários</h1>
  <form method="post" id="gradeForm">
    {% csrf_token %}
    <p>
      <label>Tipo de marcação:</label>
      <select id="modo_grader" name="modo_grader">
        <option value="data">Por data (fixa)</option>
        <option value="semanal">Por repetição (semanal)</option>
      </select>
    </p>
    {{ form.as_p }}
    <button type="submit">Salvar</button>
  </form>
  <script>
    // Esconde/libera campos conforme o tipo de marcação escolhido
    const form = document.getElementById('gradeForm');
    const modo = document.getElementById('modo_grader');
    const dateField = form.querySelector('input[name="date"]');
    const diaField = form.querySelector('select[name="day_week"]');
    const recField = form.querySelector('input[name="recurring"]');
    function toggle() {
      const semanal = modo.value === 'semanal';
      if (dateField) { dateField.disabled = semanal; dateField.parentElement.style.display = semanal ? 'none' : 'block'; }
      if (diaField) { diaField.disabled = !semanal; diaField.parentElement.style.display = !semanal ? 'none' : 'block'; }
      if (recField) { recField.checked = semanal; recField.disabled = false; }
    }
    modo.addEventListener('change', toggle);
    // Sincroniza ao carregar (se já estivesse marcado)
    if (modo) toggle();
  </script>
  <a href="{% url 'control:professional_home' %}">Voltar ao painel</a>
</body>
</html>
