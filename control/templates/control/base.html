<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sistema de Agendamento{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <style>
        [data-bs-theme="dark"] { --bs-primary: #00a859; --bs-primary-rgb: 0, 168, 89; }
        .btn-primary { --bs-btn-bg: #00a859; --bs-btn-border-color: #00a859; }
        .btn-primary:hover { --bs-btn-hover-bg: #008f4a; --bs-btn-hover-border-color: #008f4a; }
        .btn-outline-success { --bs-btn-color: #00a859; --bs-btn-border-color: #00a859; }
        .btn-outline-success:hover { --bs-btn-hover-bg: #00a859; --bs-btn-hover-border-color: #00a859; }
        .logo { font-size: 3rem; font-weight: 700; color: #00a859; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <nav class="navbar navbar-expand navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'control:home' %}" style="font-weight:700; color:#00a859;">&#9776; Agendamento</a>
            <div class="ms-auto">
                {% if request.user.is_authenticated %}
                <span class="text-light me-2">{{ request.user.username }}</span>
                <a href="{% url 'control:logout' %}" class="btn btn-outline-success btn-sm">Sair</a>
                {% else %}
                <a href="{% url 'control:login' %}" class="btn btn-primary btn-sm">Entrar</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1 my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted small py-2 mt-auto border-top bg-body-secondary">
        Sistema de Agendamento v2.7 — {% if request.user.is_staff %}Admin{% else %}Intranet{% endif %}
    </footer>
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
